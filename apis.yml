name: Kerros Health
description: 'Kerros Health (Kerros) was a digital mental-health and wellness startup building
  clinically validated, mobile-based programs proven to improve mental health, positioned as an
  evidence-based consumer brand modernizing established treatments through mobile technology and
  design. The product began as a teen-created mental-health app (originating out of Scarsdale High
  School) and grew largely through word of mouth. Co-founded by Justin Ip and backed by Cowboy
  Ventures at the seed stage, the company has since exited. It was a consumer mobile app with no
  public developer/API surface; this API Evangelist profile is maintained as a portfolio-lead record
  and no OpenAPI, SDK, or developer documentation could be found during enrichment.'
